name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Las pruebas nunca tocan fuentes vivas (docs/source-policy.md).
  LIVE_SOURCE_ENABLED: "false"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --extra pdf

      - name: Lint (ruff check)
        run: uv run ruff check src tests alembic

      - name: Formato (ruff format --check)
        run: uv run ruff format --check src tests alembic

      - name: Tipos (mypy)
        run: uv run mypy

      - name: Ontología y shapes parsean
        run: uv run python -c "from pathlib import Path; from rdflib import Graph; [Graph().parse(p) for p in Path('ontology').rglob('*.ttl')]; print('ontology OK')"

      - name: Pruebas (incluye migraciones, golden A-H, invariantes y SHACL)
        run: uv run pytest

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kipu
          POSTGRES_PASSWORD: kipu
          POSTGRES_DB: kipu
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U kipu -d kipu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync
      - name: Migraciones contra PostgreSQL real + ingesta e2e
        env:
          DATABASE_URL: postgresql+psycopg://kipu:kipu@localhost:5433/kipu
        run: |
          uv run alembic upgrade head
          uv run kipu ingest-fixture 2540861-1
          uv run kipu validate --publication-code 2540861-1
          uv run kipu export-rdf --publication-code 2540861-1
