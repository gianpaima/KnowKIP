[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# La URL real se toma de DATABASE_URL (ver alembic/env.py); este valor es fallback.
sqlalchemy.url = postgresql+psycopg://kipu:kipu@localhost:5433/kipu

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
