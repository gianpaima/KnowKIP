[project]
name = "kipu-knowledge"
version = "0.1.0"
description = "Plataforma de conocimiento verificable sobre resoluciones publicadas en El Peruano"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "lxml>=5.2",
    "typer>=0.12",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "minio>=7.2",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]

[project.scripts]
kipu = "kipu_knowledge.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kipu_knowledge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["SIM108", "B008"]  # B008: FastAPI Depends() en defaults es idiomático

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["kipu_knowledge"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = [
    "pdf: pruebas que requieren el cuadernillo PDF (omitidas si no está disponible)",
    "live: pruebas que requieren acceso de red a la fuente (deshabilitadas en CI)",
]
