<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Kipu Knowledge — Revisión{% endblock %}</title>
  <style>
    /* ------------------------------------------------------------------
       Tokens. El carmín del Diario Oficial es el único acento; los
       semánticos (advertencia, resuelto, pendiente) van aparte para que
       el rojo institucional nunca signifique "error".
       ------------------------------------------------------------------ */
    :root {
      --paper: #f6f5f2;
      --card: #ffffff;
      --ink: #22272f;
      --muted: #69707c;
      --line: #dfe1e6;
      --accent: #9d2235;
      --accent-ink: #ffffff;
      --quote-bg: #faf6ec;
      --quote-line: #d9c88a;
      --mark: #f3d271;
      --mark-ink: #3a2f0c;
      --warn-bg: #fdf0e0;
      --warn-line: #e3c493;
      --warn-ink: #7a4a10;
      --ok: #2e7d4f;
      --pending: #a06a00;
      --code-bg: #eef0f3;
      --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #14171d;
        --card: #1d222b;
        --ink: #e6e4df;
        --muted: #98a0ac;
        --line: #333b48;
        --accent: #d46072;
        --accent-ink: #22080d;
        --quote-bg: #242219;
        --quote-line: #4d452c;
        --mark: #8a6d1f;
        --mark-ink: #f7ecd2;
        --warn-bg: #332512;
        --warn-line: #5c4423;
        --warn-ink: #e5b26b;
        --ok: #5fba8a;
        --pending: #d19b3d;
        --code-bg: #272d38;
      }
    }

    /* ---------------- base ---------------- */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 400 0.95rem/1.55 var(--sans);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    code { font-family: var(--mono); font-size: 0.85em; background: var(--code-bg); padding: 0.1rem 0.35rem; border-radius: 4px; }
    h1 { font: 600 1.45rem/1.25 var(--serif); margin: 0; text-wrap: balance; }
    h2 {
      font: 600 0.75rem/1.2 var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    h3 { font: 600 0.95rem/1.3 var(--sans); margin: 1.1rem 0 0.4rem; }
    .muted { color: var(--muted); font-size: 0.85rem; }

    /* ---------------- barra superior ---------------- */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 2rem;
      padding: 0.8rem 1.5rem;
      flex-wrap: wrap;
    }
    .brand { font: 700 1.05rem var(--serif); color: var(--ink); }
    .brand span { color: var(--accent); }
    .topbar nav { display: flex; gap: 1.25rem; }
    .topbar nav a { color: var(--muted); font-size: 0.9rem; }
    .topbar nav a:hover { color: var(--accent); text-decoration: none; }

    main { max-width: 64rem; margin: 0 auto; padding: 1.5rem; }
    main:has(.layout) { max-width: 112rem; }
    .page-head { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1.25rem; }
    .page-head .meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .lede { font: 400 1.02rem/1.5 var(--serif); margin: 0; max-width: 62ch; }

    /* ---------------- tarjetas y layout ---------------- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
    .stack { display: flex; flex-direction: column; gap: 1rem; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1.25rem;
      align-items: start;
    }
    @media (max-width: 70rem) { .layout { grid-template-columns: 1fr; } }

    /* ---------------- pills y chips ---------------- */
    .pill {
      display: inline-block;
      font: 600 0.7rem/1 var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .pill.pending  { color: var(--pending); border-color: currentColor; }
    .pill.resolved { color: var(--ok); border-color: currentColor; }
    .chip { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); }
    .prio { font-variant-numeric: tabular-nums; }
    .prio-1, .prio-2 { color: var(--accent); font-weight: 700; }

    /* ---------------- evidencia ---------------- */
    .evidence {
      background: var(--quote-bg);
      border-left: 3px solid var(--quote-line);
      border-radius: 0 6px 6px 0;
      font: 400 0.95rem/1.6 var(--serif);
      padding: 0.8rem 1rem;
      margin: 0.6rem 0;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    .evidence mark { background: var(--mark); color: var(--mark-ink); padding: 0 0.15rem; border-radius: 3px; }
    .warn {
      background: var(--warn-bg);
      border: 1px solid var(--warn-line);
      border-radius: 6px;
      color: var(--warn-ink);
      padding: 0.6rem 0.9rem;
      font-size: 0.88rem;
    }
    details summary { cursor: pointer; color: var(--muted); font-size: 0.88rem; }
    details[open] summary { margin-bottom: 0.5rem; }

    /* ---------------- tablas ---------------- */
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    th {
      font: 600 0.72rem var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      text-align: left;
      padding: 0.6rem 0.8rem;
      border-bottom: 1px solid var(--line);
    }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
    td.num { font-variant-numeric: tabular-nums; }

    /* ---------------- formulario de decisión ---------------- */
    form.decision { display: flex; flex-direction: column; gap: 0.9rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field > label {
      font: 600 0.72rem var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
    }
    .field .hint { margin: 0; font-size: 0.8rem; color: var(--muted); }
    input[type=text], select, textarea {
      width: 100%;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.45rem 0.6rem;
      font: 400 0.92rem var(--sans);
    }
    input[type=text]:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
    fieldset {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    legend { font-size: 0.8rem; color: var(--muted); padding: 0 0.4rem; }

    /* Listas de opciones: una decisión por fila, con el área de clic completa.
       Sustituyen a los campos de identificador que obligaban a copiar hexadecimales. */
    fieldset.choices { border-style: solid; gap: 0; padding: 0.5rem; }
    fieldset.choices > legend {
      font: 600 0.72rem var(--sans);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .choice {
      display: flex;
      gap: 0.6rem;
      align-items: baseline;
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .choice:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
    .choice:has(input:checked) { background: color-mix(in srgb, var(--accent) 9%, transparent); }
    .choice:has(input:disabled) { cursor: not-allowed; opacity: 0.55; }
    .choice input { margin: 0; accent-color: var(--accent); flex: none; }
    .choice > span { line-height: 1.4; }
    .choice .muted { font-size: 0.82rem; }
    fieldset.choices details { padding: 0.4rem 0.6rem; }
    .summary {
      margin: 0;
      background: var(--quote-bg);
      border-left: 3px solid var(--quote-line);
      border-radius: 0 6px 6px 0;
      padding: 0.6rem 0.9rem;
      font-size: 0.88rem;
    }
    [hidden] { display: none !important; }
    button {
      align-self: flex-start;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: 6px;
      font: 600 0.92rem var(--sans);
      padding: 0.55rem 1.3rem;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }

    /* ---------------- panel de captura ---------------- */
    .preview { position: sticky; top: 1rem; }
    .preview-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .preview iframe, .preview img {
      width: 100%;
      height: calc(100vh - 12rem);
      min-height: 24rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }
    .preview img { height: auto; }

    .participant { border-top: 1px solid var(--line); padding-top: 0.75rem; margin-top: 0.75rem; }
    .participant:first-of-type { border-top: none; padding-top: 0; margin-top: 0.4rem; }

    .captures { margin: 0.35rem 0 0; padding-left: 1.1rem; font-size: 0.85rem; }
    .captures li { margin-bottom: 0.2rem; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/review">Kipu<span> Knowledge</span> · mesa de revisión</a>
  <nav>
    <a href="/review">Pendientes</a>
    <a href="/review?status=RESOLVED">Resueltas</a>
    <a href="/review/history">Historial de decisiones</a>
    <a href="/docs">API</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
